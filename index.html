<style>
  :root{--navy:#0b1c2c;--navy2:#132b40;--ice:#5fb8e8;--gold:#c9a24b;--line:#dbe4ec;}
  html,body{background:#f3f6f9;-webkit-tap-highlight-color:transparent;}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;}
  .font-display{font-family:ui-serif,Georgia,'Times New Roman',serif;}
  .bg-navy{background:var(--navy);}
  .bg-navy2{background:var(--navy2);}
  .text-ice{color:var(--ice);}
  .text-gold{color:var(--gold);}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:#c7d4e0;border-radius:8px;}
  .status-pill{display:inline-flex;align-items:center;gap:.35rem;padding:.2rem .65rem;border-radius:999px;font-size:.68rem;font-weight:700;letter-spacing:.03em;text-transform:uppercase;white-space:nowrap;}
  .cond-pill{display:inline-flex;align-items:center;gap:.3rem;padding:.12rem .5rem;border-radius:999px;font-size:.65rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border-radius:10px;padding:.55rem 1rem;font-weight:600;font-size:.88rem;transition:opacity .15s;cursor:pointer;border:1px solid transparent;}
  .btn:active{opacity:.75;}
  .btn-primary{background:var(--navy);color:#fff;}
  .btn-gold{background:var(--gold);color:#241a06;}
  .btn-outline{background:#fff;border-color:#cdd8e3;color:#1f2d3a;}
  .btn-danger{background:#fff;border-color:#f3c2c2;color:#b42318;}
  .btn-sm{padding:.35rem .7rem;font-size:.78rem;}
  .input{width:100%;border:1px solid #cdd8e3;border-radius:9px;padding:.5rem .65rem;font-size:.9rem;background:#fff;}
  .input:focus{outline:2px solid var(--ice);outline-offset:0;border-color:var(--ice);}
  .label{display:block;font-size:.72rem;font-weight:700;color:#5a6b7a;text-transform:uppercase;letter-spacing:.03em;margin-bottom:.25rem;}
  .toggle3 button{flex:1;padding:.4rem 0;font-size:.74rem;font-weight:700;text-transform:uppercase;border:1px solid #cdd8e3;background:#fff;color:#5a6b7a;}
  .toggle3 button:first-child{border-radius:8px 0 0 8px;}
  .toggle3 button:last-child{border-radius:0 8px 8px 0;}
  .toggle3 button.active-ok{background:#e7f6ec;border-color:#2f9e55;color:#206b3a;}
  .toggle3 button.active-missing{background:#fff3da;border-color:#c98a1a;color:#8a5e0f;}
  .toggle3 button.active-damaged{background:#fde8e8;border-color:#c0392b;color:#8a2a20;}
  #modal-root:empty{display:none;}
  .modal-backdrop{position:fixed;inset:0;background:rgba(10,20,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  @media(min-width:768px){.modal-backdrop{align-items:center;}}
  .modal-panel{background:#fff;border-radius:16px 16px 0 0;max-width:640px;width:100%;max-height:92vh;overflow-y:auto;}
  @media(min-width:768px){.modal-panel{border-radius:16px;margin:1rem;}}
  .toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0b1c2c;color:#fff;padding:.6rem 1.1rem;border-radius:10px;font-size:.85rem;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.25);}
  .cam-wrap{position:relative;background:#000;border-radius:14px;overflow:hidden;}
  .cam-wrap video{width:100%;display:block;max-height:60vh;object-fit:cover;}
  .cam-frame{position:absolute;inset:14% 20%;border:3px solid rgba(95,184,232,.95);border-radius:18px;pointer-events:none;box-shadow:0 0 0 2000px rgba(0,0,0,.25);}
  table.wd-table{width:100%;border-collapse:collapse;font-size:.82rem;}
  table.wd-table th{text-align:left;font-size:.68rem;text-transform:uppercase;letter-spacing:.03em;color:#5a6b7a;padding:.5rem .6rem;border-bottom:1px solid var(--line);white-space:nowrap;}
  table.wd-table td{padding:.5rem .6rem;border-bottom:1px solid #eef2f6;vertical-align:top;}
  table.wd-table tr:hover td{background:#f8fafc;}
  @media print {
    body *{visibility:hidden;}
    #print-area,#print-area *{visibility:visible;}
    #print-area{position:absolute;left:0;top:0;width:100%;padding:0;margin:0;}
    .no-print{display:none!important;}
  }
</style>

<body>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
'use strict';

/* ============================================================
   CONFIG / CONSTANTS
   ============================================================ */
const CAMPS = ["Echo Camp","Whichaway Camp","Wolf's Fang Runway","Kana Base","Explorer 2.0","ATKA Bay","Dixie Camp","Fuel Depot Camp","Transit","National Programs","Traverse","Other"];
const WAREHOUSE_LABEL = "Warehouse — Cape Town";

const PKG_STATUS = {
  awaiting:  { label: "Awaiting Warehouse",  color: "background:#eef1f5;color:#4a5a68;" },
  warehouse: { label: "In Warehouse (CPT)",  color: "background:#e4eefb;color:#1e5fa8;" },
  dispatched:{ label: "Dispatched / Transit",color: "background:#fff2db;color:#9a6a0a;" },
  received:  { label: "Received at Camp",    color: "background:#e4f6e9;color:#1d7a40;" },
};
const COND = {
  pending: { label:"Pending", cls:"" },
  ok:      { label:"OK", cls:"active-ok" },
  missing: { label:"Missing", cls:"active-missing" },
  damaged: { label:"Damaged", cls:"active-damaged" },
};

/* ============================================================
   UTILITIES
   ============================================================ */
function esc(s){
  if (s === null || s === undefined) return "";
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function genTag(prefix){
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; // no 0/O/1/I to keep labels readable
  let s = "";
  for (let i=0;i<5;i++) s += chars[Math.floor(Math.random()*chars.length)];
  return "WD-" + prefix + "-" + s;
}
function volWeightKg(lmm,bmm,hmm){
  const l=Number(lmm)||0, b=Number(bmm)||0, h=Number(hmm)||0;
  if (!l || !b || !h) return 0;
  return (l/10) * (b/10) * (h/10) / 5000;
}
function num(v){ const n = Number(v); return isFinite(n) ? n : 0; }
function fmtKg(v){ return (Math.round(num(v)*100)/100).toLocaleString(undefined,{minimumFractionDigits:0, maximumFractionDigits:2}) + " kg"; }
function fmtNum(v){ return Math.round(num(v)*100)/100; }
function fmtDate(ts){
  if (!ts) return "—";
  const d = new Date(ts);
  if (isNaN(d.getTime())) return "—";
  return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'}) + " " + d.toLocaleTimeString(undefined,{hour:'2-digit',minute:'2-digit'});
}
function fmtDateShort(ts){
  if (!ts) return "—";
  const d = new Date(ts);
  if (isNaN(d.getTime())) return "—";
  return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
}
function todayISO(){ return new Date().toISOString().slice(0,10); }

/* ============================================================
   FX / CURRENCY CONVERSION
   Rates are fetched client-side from a free, keyless public API and
   cached in the shared config/settings doc so every viewer reuses the
   same recently-fetched rate instead of each hitting the API.
   ============================================================ */
const FX_STALE_MS = 6*60*60*1000; // 6 hours
let _fxFetchInFlight = null;
function fxIsStale(){
  const updated = S.config && S.config.fxUpdatedAt;
  if (!updated) return true;
  return (Date.now() - Number(updated)) > FX_STALE_MS;
}
async function ensureFxRates(forceRefresh){
  if (!forceRefresh && !fxIsStale()) return S.config.fx || {};
  if (_fxFetchInFlight) return _fxFetchInFlight;
  _fxFetchInFlight = (async ()=>{
    try{
      const res = await fetch('https://open.er-api.com/v6/latest/USD');
      if (!res.ok) throw new Error('rate lookup failed ('+res.status+')');
      const json = await res.json();
      if (!json || json.result !== 'success' || !json.rates) throw new Error('rate lookup returned no data');
      // json.rates[CUR] = units of CUR per 1 USD, so 1 CUR = 1/rate USD
      const usdPerUnit = {};
      Object.keys(json.rates).forEach(cur=>{
        const r = Number(json.rates[cur]);
        if (r>0) usdPerUnit[cur] = 1/r;
      });
      usdPerUnit.USD = 1;
      const now = Date.now();
      const ref = S.db.doc('config/settings');
      const snap = await ref.get();
      const patch = { fx: usdPerUnit, fxUpdatedAt: now, fxSourceTime: json.time_last_update_utc || null };
      if (snap.exists) await ref.update(patch); else await ref.set(patch);
      S.config = Object.assign({}, S.config, patch);
      return usdPerUnit;
    } finally {
      _fxFetchInFlight = null;
    }
  })();
  return _fxFetchInFlight;
}
function toUSD(amount, currency){
  const amt = num(amount);
  if (!amt) return 0;
  const cur = (currency||'USD').trim().toUpperCase();
  if (cur === 'USD') return amt;
  const rates = (S.config && S.config.fx) || {};
  if (rates[cur] != null) return amt * rates[cur];
  return null; // unknown currency — can't convert, caller should show "—"
}
function fmtUsd(v){
  if (v===null || v===undefined) return '—';
  return '$' + Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtMoney(v, cur){
  if (v===null || v===undefined) return '—';
  return (cur?cur+' ':'') + Number(v).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
}

/* ============================================================
   FIRESTORE WRAPPER
   Thin adapter giving the Firebase v9 modular SDK the exact same
   collection()/doc() shape the rest of this app is written against,
   so none of the business logic below had to change in the port
   off the Claude artifact's db capability.
   ============================================================ */
function wrapFirestore(dbInstance){
  function wrapDocSnap(docSnap){ return { exists: docSnap.exists(), data: ()=> docSnap.data() }; }
  function wrapQuerySnap(querySnap){ return { docs: querySnap.docs.map(d=>({ id: d.id, data: ()=> d.data() })) }; }
  function makeDocRef(path){
    const ref = FB.doc(dbInstance, path);
    return {
      id: ref.id,
      get: async ()=> wrapDocSnap(await FB.getDoc(ref)),
      set: async (data)=> FB.setDoc(ref, data),
      update: async (patch)=> FB.updateDoc(ref, patch),
      delete: async ()=> FB.deleteDoc(ref),
      onSnapshot(next, errCb){ return FB.onSnapshot(ref, snap=> next(wrapDocSnap(snap)), errCb); },
    };
  }
  function makeCollectionRef(path, limitN){
    const base = FB.collection(dbInstance, path);
    const q = limitN ? FB.query(base, FB.limit(limitN)) : base;
    return {
      limit(n){ return makeCollectionRef(path, n); },
      onSnapshot(next, errCb){ return FB.onSnapshot(q, snap=> next(wrapQuerySnap(snap)), errCb); },
      get: async ()=> wrapQuerySnap(await FB.getDocs(q)),
      doc(id){ return makeDocRef(path + '/' + id); },
      add: async (data)=>{ const ref = await FB.addDoc(base, data); return makeDocRef(path + '/' + ref.id); },
    };
  }
  return {
    collection(path){ return makeCollectionRef(path); },
    doc(path){ return makeDocRef(path); },
  };
}

/* ============================================================
   DICTATION (Web Speech API — replaces the Claude dictation capability)
   Same start()/stop()/onPartial()/onFinal() shape as before, so
   toggleDictation() below needed no changes. Feature-detected:
   returns null on browsers without SpeechRecognition (e.g. most
   iOS Safari versions), and the mic button is hidden in that case.
   ============================================================ */
function createDictationAdapter(){
  const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Ctor) return null;
  let rec = null, onPartialCb = null, onFinalCb = null;
  return {
    start: async ()=>{
      rec = new Ctor();
      rec.continuous = true; rec.interimResults = true; rec.lang = 'en-US';
      rec.onresult = (e)=>{
        let finalText = '', partialText = '';
        for (let i = e.resultIndex; i < e.results.length; i++){
          const r = e.results[i];
          if (r.isFinal) finalText += r[0].transcript; else partialText += r[0].transcript;
        }
        if (partialText && onPartialCb) onPartialCb({ text: partialText });
        if (finalText && onFinalCb) onFinalCb({ text: finalText });
      };
      rec.onerror = ()=>{};
      rec.start();
    },
    stop: async ()=>{ if (rec) rec.stop(); },
    onPartial: (cb)=>{ onPartialCb = cb; },
    onFinal: (cb)=>{ onFinalCb = cb; },
  };
}

async function boot(){
  initPinGate();
  S.dictationCap = createDictationAdapter();

  // Test-harness seam: a headless test can set window.__TEST_DB__ /
  // window.__TEST_STORAGE__ before calling boot() to inject a fake
  // backing store instead of talking to real Firebase.
  if (window.__TEST_DB__){
    S.db = window.__TEST_DB__;
    S.storage = window.__TEST_STORAGE__ || null;
    S.dbReady = true;
    subscribeAll();
    render();
    return;
  }

  try{
    const app = FB.initializeApp(FIREBASE_CONFIG);
    S.db = wrapFirestore(FB.getFirestore(app));
    S.storage = FB.getStorage(app);
    S.dbReady = true;
    subscribeAll();
  }catch(e){
    console.warn('firebase connect failed', e);
    S.dbReady = false;
  }
  render();
}

function subscribeAll(){
  const unsubPkg = S.db.collection('packages').limit(1000).onSnapshot(snap=>{
    S.packages = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    render();

  const unsubItems = S.db.collection('items').limit(5000).onSnapshot(snap=>{
    S.items = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));

  const unsubReports = S.db.collection('reports').limit(1000).onSnapshot(snap=>{
    S.reports = snap.docs.map(d=>Object.assign({id:d.id}, d.data()));
    render();
  }, err=>{ console.warn('reports sub error', err); });

  const unsubConfig = S.db.doc('config/settings').onSnapshot(snap=>{
    S.config = snap.exists ? snap.data() : {};

    render();
  }, err=>{ console.warn('config sub error', err); });

}

function openManualTag(){
  const v = (document.getElementById('manual-tag').value||'').trim().toUpperCase();
  routeToTag(v);
}
function parseScannedValue(raw){
  if (!raw) return null;
  try{
    const u = new URL(raw);
    const t = u.searchParams.get('open');
    if (t) return t.toUpperCase();
  }catch(e){ /* not a URL */ }
  const m = raw.toUpperCase().match(/WD-[PI]-[A-Z0-9]+/);
  return m ? m[0] : null;
}
function routeToTag(tag){
  if (!tag) { toast('Could not read a package or item tag from that code.', true); return; }
  if (tag.startsWith('WD-P-')) navigate('/package/'+tag);
  else if (tag.startsWith('WD-I-')) navigate('/item/'+tag);
  else toast('Unrecognised tag: '+tag, true);
}
function startCamera(){
  const statusEl = document.getElementById('cam-status');
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    statusEl.textContent = 'Camera access is not available in this browser. Use manual entry below.';
    return;
  }
  navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(stream=>{
    S.camStream = stream;
    const video = document.getElementById('cam-video');
    if (!video) { stream.getTracks().forEach(t=>t.stop()); return; }
    video.srcObject = stream;
    video.play();
    statusEl.textContent = 'Scanning…';
    scanLoop();
  }).catch(err=>{
    statusEl.textContent = 'Could not access the camera (' + (err && err.name || 'error') + '). Please allow camera permission, or use manual entry below.';
  });
}
function stopCamera(){
  if (S.camRAF) { cancelAnimationFrame(S.camRAF); S.camRAF = null; }
  if (S.camStream) { S.camStream.getTracks().forEach(t=>t.stop()); S.camStream = null; }
}
function scanLoop(){
  const video = document.getElementById('cam-video');
  if (!video || !S.camStream) return;
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  function tick(){
    if (!S.camStream) return;
    if (video.readyState === video.HAVE_ENOUGH_DATA && window.jsQR){
      canvas.width = video.videoWidth; canvas.height = video.videoHeight;
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      try{
        const img = ctx.getImageData(0,0,canvas.width,canvas.height);
        const code = window.jsQR(img.data, img.width, img.height);
        if (code && code.data){
          const tag = parseScannedValue(code.data);
          if (tag){ stopCamera(); routeToTag(tag); return; }
        }
      }catch(e){ /* ignore frame errors */ }
    }
    S.camRAF = requestAnimationFrame(tick);
  }
  S.camRAF = requestAnimationFrame(tick);
}

function costBreakdown(pkgs){
  const byCur = {};
  pkgs.forEach(p=>{
    const amt = num(p.poAmount);
    if (!amt) return;
    const cur = (p.poCurrency||'USD').trim().toUpperCase();
    byCur[cur] = (byCur[cur]||0) + amt;
  });
  let usdTotal = 0; const unresolvedCurs = [];
  Object.keys(byCur).forEach(cur=>{
    const usd = toUSD(byCur[cur], cur);
    if (usd===null) unresolvedCurs.push(cur);
    else usdTotal += usd;
  });
  return { byCur, usdTotal, unresolvedCurs };
}
function costBreakdownHtml(pkgs){
  const {byCur, usdTotal, unresolvedCurs} = costBreakdown(pkgs);
  const curs = Object.keys(byCur);
  if (!curs.length) return '<div class="text-xs text-slate-400">No PO / invoice amounts recorded.</div>';
  const rows = curs.map(cur=>{
    const usd = toUSD(byCur[cur], cur);
    return '<div class="flex justify-between text-xs py-0.5"><span>'+esc(cur)+'</span><span>'+fmtMoney(byCur[cur],cur)+(cur!=='USD'? '  ≈ '+fmtUsd(usd) : '')+'</span></div>';
  }).join('');
  const warn = unresolvedCurs.length ? '<div class="text-[11px] text-amber-600 mt-1">No exchange rate for '+unresolvedCurs.map(esc).join(', ')+' yet — excluded from the USD total below.</div>' : '';
  return rows + '<div class="flex justify-between text-sm font-bold pt-1 border-t border-slate-100 mt-1"><span>Total (USD)</span><span>'+fmtUsd(usdTotal)+'</span></div>' + warn;
}
function fxStatusHtml(){

  if (!fx || !updated){

  }

}

function buildMovementLog(campFilter){
  const events = [];
  S.packages.forEach(p=>{
    if (campFilter && p.destinationCamp !== campFilter) return;
    if (p.warehouseReceivedAt) events.push({ts:p.warehouseReceivedAt, type:'Received at Warehouse', pkg:p.id, desc:p.description, camp:p.destinationCamp, by:p.warehouseReceivedBy});
    if (p.dispatchedAt) events.push({ts:p.dispatchedAt, type:'Dispatched', pkg:p.id, desc:p.description, camp:p.destinationCamp, by:p.dispatchedBy});
    if (p.campReceivedAt) events.push({ts:p.campReceivedAt, type:'Received at Camp', pkg:p.id, desc:p.description, camp:p.destinationCamp, by:p.campReceivedBy});
  });
  events.sort((a,b)=>(b.ts||0)-(a.ts||0));
  return events;
}
function campRollups(){
  const pkgMap = packagesByTag();
  return CAMPS.map(camp=>{
    const pkgs = S.packages.filter(p=>p.destinationCamp===camp);
    const items = S.items.filter(i=>{ const p=pkgMap[i.packageTag]; return p && p.destinationCamp===camp; });
    const weight = items.reduce((a,i)=>a+num(i.weightTotalKg),0);
    const dispatched = pkgs.filter(p=>p.status==='dispatched').length;
    const received = pkgs.filter(p=>p.status==='received').length;
    const { usdTotal } = costBreakdown(pkgs);
    return { camp, pkgCount: pkgs.length, itemCount: items.length, weight, dispatched, received, usdTotal, pkgs };
  });
}

function csvCell(v){ v = (v===undefined||v===null)?'':String(v); return '"'+v.replace(/"/g,'""')+'"'; }
function triggerCsvDownload(filename, csv){
  try{
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ document.body.removeChild(a); URL.revokeObjectURL(url); }, 0);
  }catch(e){
    toast('Could not trigger a file download in this view.', true);
  }
}
function exportReportCsv(){
  const campFilter = S._reportCamp || '';
  const pkgMap = packagesByTag();
  let items = S.items.slice().map(i=>Object.assign({}, i, { _pkg: pkgMap[i.packageTag] }));
  if (campFilter) items = items.filter(i => i._pkg && i._pkg.destinationCamp === campFilter);
  const header = ['Camp','Package','Item Tag','Description','Qty/Pkg','Pieces','L(mm)','B(mm)','H(mm)','Wt Each(kg)','Wt Total(kg)','Vol Wt(kg)','Hazmat'];
  const lines = [header.join(',')];
  items.forEach(i=>{
    const row = [i._pkg?i._pkg.destinationCamp:'', i._pkg?i._pkg.description:'', i.id, i.description, i.qtyPerPkg, i.totalPieces, i.lengthMm, i.widthMm, i.heightMm, i.weightEachKg, i.weightTotalKg, i.volumetricWeightKg, i.hazmat?'Yes':'No'];
    lines.push(row.map(csvCell).join(','));
  });
  triggerCsvDownload('white-desert-logistics-report.csv', lines.join('\r\n'));
}
function exportMovementCsv(){
  const campFilter = S._reportCamp || '';
  const moves = buildMovementLog(campFilter);
  const header = ['Date','Event','Package','Description','Camp','By'];
  const lines = [header.join(',')];
  moves.forEach(m=>{
    const row = [fmtDate(m.ts), m.type, m.pkg, m.desc, m.camp, m.by];
    lines.push(row.map(csvCell).join(','));
  });
  triggerCsvDownload('white-desert-logistics-movement-log.csv', lines.join('\r\n'));
}
function exportCampSummaryCsv(){
  const camps = campRollups();
  const header = ['Camp','Packages','Items','Weight (kg)','Dispatched','Received','Cost (USD)'];
  const lines = [header.join(',')];
  camps.forEach(c=>{
    const row = [c.camp, c.pkgCount, c.itemCount, fmtNum(c.weight), c.dispatched, c.received, c.usdTotal!=null?fmtNum(c.usdTotal):''];
    lines.push(row.map(csvCell).join(','));
  });
  triggerCsvDownload('white-desert-logistics-camp-summary.csv', lines.join('\r\n'));
}

async function saveWhatsapp(){
  const val = document.getElementById('wa-number').value.trim();
  try{
    const ref = S.db.doc('config/settings');
    const snap = await ref.get();
    if (snap.exists) await ref.update({ whatsappNumber: val });
    else await ref.set({ whatsappNumber: val });
    toast('Saved.');
  }catch(e){ toast('Could not save: '+e.message, true); }
}
async function saveAccessPin(){
  const val = document.getElementById('pin-setting').value.trim();
  try{
    const ref = S.db.doc('config/settings');
    const snap = await ref.get();
    if (snap.exists) await ref.update({ accessPin: val });
    else await ref.set({ accessPin: val });
    // keep this device unlocked under the new code so the person saving it isn't locked out themselves
    try{ localStorage.setItem('wd_pin_entered', val || DEFAULT_PIN); }catch(e){}
    toast('Saved. Share the new code with the team — anyone on an older code will need it.');
  }catch(e){ toast('Could not save: '+e.message, true); }
}
async function resetAllData(){
  if (!confirm('This deletes ALL packages, items and reports. Are you sure?')) return;
  if (!confirm('Really sure? This cannot be undone.')) return;
  try{
    for (const col of ['packages','items','reports']){
      const snap = await S.db.collection(col).limit(1000).get();
      for (const d of snap.docs){ await S.db.doc(col+'/'+d.id).delete(); }
    }
    toast('All data cleared.');
  }catch(e){ toast('Reset failed: '+e.message, true); }
}

  catch(e){ console.warn('qr draw failed', e); }

    weightEachKg: wEach, weightTotalKg: wEach * pcs,
    volumetricWeightKg: volWeightKg(l,b,h) * pcs,
    colour: document.getElementById('ai-colour').value.trim(),
    hazmat: document.getElementById('ai-hazmat').checked,
    warehouseReceiveStatus: 'pending', campReceiveStatus: 'pending',
    createdAt: Date.now(),
  };
  try{
    await S.db.collection('items').doc(tag).set(data);
    await S.db.doc('packages/'+packageTag).update({ updatedAt: Date.now() });
    closeModal();
    toast('Item '+tag+' added.');
  }catch(e){ toast('Could not add item: '+e.message, true); }
}

/* ---- Receive (Warehouse or Camp) ---- */
function openReceiveModal(packageTag, stage){
  const p = S.packages.find(x=>x.id===packageTag);
  const items = itemsForPackage(packageTag);
  const title = stage==='warehouse' ? 'Receive at Warehouse' : 'Receive at Camp — '+ (p?p.destinationCamp:'');
  const rows = items.map(it=>{
    const field = stage==='warehouse' ? (it.warehouseReceiveStatus||'ok') : (it.campReceiveStatus||'ok');
    return '<div class="border border-slate-200 rounded-lg p-3 mb-2" data-item-row="'+it.id+'">' +
      '<div class="flex items-center justify-between mb-2"><span class="text-sm font-medium">'+esc(it.description||it.id)+'</span><span class="font-mono text-[10px] text-slate-400">'+esc(it.id)+'</span></div>' +
      '<div class="flex toggle3" data-item="'+it.id+'">' +
        '<button type="button" class="'+(field==='ok'?'active-ok':'')+'" data-val="ok" onclick="setCond(this,\''+it.id+'\')">OK</button>' +
        '<button type="button" class="'+(field==='missing'?'active-missing':'')+'" data-val="missing" onclick="setCond(this,\''+it.id+'\')">Missing</button>' +
        '<button type="button" class="'+(field==='damaged'?'active-damaged':'')+'" data-val="damaged" onclick="setCond(this,\''+it.id+'\')">Damaged</button>' +
      '</div>' +
      '<input type="text" class="input mt-2" placeholder="Note (optional)" data-note="'+it.id+'">' +
    '</div>';
  }).join('') || '<div class="text-sm text-slate-400">No items on this package yet.</div>';
  const body = '<div class="space-y-3">' +
    field('text','rc-name','Your name','',true) +
    '<div>' + rows + '</div>' +
  '</div>';
  const foot = '<button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitReceive(\''+packageTag+'\',\''+stage+'\')">Confirm Receipt</button>';
  document.getElementById('modal-root').innerHTML = modalShell(title, body, foot);
}
function setCond(btn, itemId){
  const group = btn.parentElement;
  qsa('button', group).forEach(b=>b.className = b.className.replace(/active-(ok|missing|damaged)/,'').trim());
  btn.classList.add('active-'+btn.dataset.val);
}
async function submitReceive(packageTag, stage){
  const name = document.getElementById('rc-name').value.trim();
  if (!name){ toast('Your name is required.', true); return; }
  const now = Date.now();
  const items = itemsForPackage(packageTag);
  try{
    for (const it of items){
      const group = document.querySelector('[data-item="'+it.id+'"]');
      const activeBtn = group ? group.querySelector('button.active-ok, button.active-missing, button.active-damaged') : null;
      const val = activeBtn ? activeBtn.dataset.val : 'ok';
      const noteEl = document.querySelector('[data-note="'+it.id+'"]');
      const note = noteEl ? noteEl.value.trim() : '';
      const patch = {};
      if (stage==='warehouse'){ patch.warehouseReceiveStatus = val; patch.warehouseReceiveNote = note; patch.warehouseReceivedAt = now; patch.warehouseReceivedBy = name; }
      else { patch.campReceiveStatus = val; patch.campReceiveNote = note; patch.campReceivedAt = now; patch.campReceivedBy = name; }
      await S.db.doc('items/'+it.id).update(patch);
    }
    const pkgPatch = { updatedAt: now };
    if (stage==='warehouse'){ pkgPatch.status = 'warehouse'; pkgPatch.warehouseReceivedAt = now; pkgPatch.warehouseReceivedBy = name; }
    else { pkgPatch.status = 'received'; pkgPatch.campReceivedAt = now; pkgPatch.campReceivedBy = name; }
    await S.db.doc('packages/'+packageTag).update(pkgPatch);
    closeModal();
    toast('Receipt recorded.');
  }catch(e){ toast('Could not record receipt: '+e.message, true); }
}

/* ---- Dispatch ---- */
function openDispatchModal(packageTag){
  const p = S.packages.find(x=>x.id===packageTag);
  const campOpts = CAMPS.map(c=>'<option value="'+esc(c)+'" '+(c===(p&&p.destinationCamp)?'selected':'')+'>'+esc(c)+'</option>').join('');
  const body = '<div class="space-y-3">' +
    '<div><div class="label">Destination camp</div><select id="dp-camp" class="input">'+campOpts+'</select></div>' +
    '<div class="grid grid-cols-2 gap-2">' +
      '<div><div class="label">Method</div><select id="dp-method" class="input"><option>Flight</option><option>Vessel</option><option>Traverse</option><option>Other</option></select></div>' +
      field('text','dp-ref','Flight / vessel reference') +
    '</div>' +
    field('date','dp-date','Dispatch date') +
    field('text','dp-name','Your name','',true) +
  '</div>';
  const foot = '<button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitDispatch(\''+packageTag+'\')">Confirm Dispatch</button>';
  document.getElementById('modal-root').innerHTML = modalShell('Dispatch to Camp', body, foot);
  setTimeout(()=>{ const d=document.getElementById('dp-date'); if(d && !d.value) d.value = todayISO(); },0);
}
async function submitDispatch(packageTag){
  const name = document.getElementById('dp-name').value.trim();
  if (!name){ toast('Your name is required.', true); return; }
  const now = Date.now();
  try{
    await S.db.doc('packages/'+packageTag).update({
      status: 'dispatched',
      destinationCamp: document.getElementById('dp-camp').value,
      dispatchMethod: document.getElementById('dp-method').value,
      dispatchRef: document.getElementById('dp-ref').value.trim(),
      dispatchDate: document.getElementById('dp-date').value,
      dispatchedAt: now, dispatchedBy: name, updatedAt: now,
    });
    closeModal();
    toast('Marked as dispatched.');
  }catch(e){ toast('Could not dispatch: '+e.message, true); }
}

/* ---- Field Report ---- */
function openReportModal(packageTag){
  const body = '<div class="space-y-3">' +
    field('text','rp-name','Your name','',true) +
    '<div><div class="label">Report type</div><select id="rp-type" class="input"><option>Completed Installation</option><option>Finding</option><option>Issue</option><option>Damage</option><option>Query</option></select></div>' +
    '<div><div class="label">Description</div>' +
      '<div class="flex gap-2"><textarea id="rp-desc" class="input" rows="4"></textarea>' +
      '<button type="button" id="rp-dictate" class="btn btn-outline btn-sm" onclick="toggleDictation()">🎙</button></div>' +
    '</div>' +
    '<div><div class="label">Photo (optional)</div><input type="file" id="rp-photo" accept="image/*"></div>' +
  '</div>';
  const foot = '<button class="btn btn-outline" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitReport(\''+packageTag+'\')">Submit Report</button>';
  document.getElementById('modal-root').innerHTML = modalShell('New Field Report', body, foot);
}
let dictating = false;
async function toggleDictation(){
  const btn = document.getElementById('rp-dictate');
  const ta = document.getElementById('rp-desc');
  if (!S.dictationCap){ toast('Voice dictation is not available in this browser.', true); return; }
  if (!dictating){
    try{
      await S.dictationCap.start();
      dictating = true; btn.textContent = '⏹';
      S.dictationCap.onPartial(({text})=>{ ta.dataset.partial = text; });
      S.dictationCap.onFinal(({text})=>{ ta.value = (ta.value + ' ' + text).trim(); });
    }catch(e){ toast('Microphone not granted.', true); }
  } else {
    await S.dictationCap.stop();
    dictating = false; btn.textContent = '🎙';
  }
}
async function uploadReportPhoto(file){
  if (!S.storage) throw new Error('storage not ready');
  const path = 'reports/' + Date.now() + '-' + Math.random().toString(36).slice(2) + '-' + file.name;
  const r = FB.ref(S.storage, path);
  await FB.uploadBytes(r, file);
  return await FB.getDownloadURL(r);
}
async function submitReport(packageTag){
  const name = document.getElementById('rp-name').value.trim();
  const desc = document.getElementById('rp-desc').value.trim();
  if (!name || !desc){ toast('Your name and a description are required.', true); return; }
  const p = S.packages.find(x=>x.id===packageTag);
  let photoUrl = null;
  let photoFailed = false;
  const fileInput = document.getElementById('rp-photo');
  try{
    if (fileInput && fileInput.files && fileInput.files[0]){
      photoUrl = await uploadReportPhoto(fileInput.files[0]);
    }
  }catch(e){ console.warn('photo upload failed', e); photoFailed = true; }
  try{
    await S.db.collection('reports').add({
      packageTag, campAtReport: p? p.destinationCamp: '',
      type: document.getElementById('rp-type').value,
      description: desc, reporterName: name,
      photoUrl, ts: Date.now(),
    });
    closeModal();
    toast(photoFailed ? 'Report submitted — photo could not be attached (Storage isn\'t set up).' : 'Report submitted.');
  }catch(e){ toast('Could not submit report: '+e.message, true); }
}

/* ============================================================
   GLOBAL CLICK HANDLER FOR "+ New Package" NAV LINK
   ============================================================ */
window.addEventListener('hashchange', ()=>{
  if (currentRoute()[0]==='new-package'){ openNewPackageModal(); history.replaceState(null,'',location.pathname+location.search+'#/packages'); }
});
document.addEventListener('click', e=>{
  const a = e.target.closest('a[href="#/new-package"]');
  if (a){ e.preventDefault(); openNewPackageModal(); }
});

/* ============================================================
   INITIAL LOAD: handle ?open=TAG deep link from scanned QR
   ============================================================ */
function handleInitialDeepLink(){
  const url = new URL(location.href);
  const open = url.searchParams.get('open');
  if (open){
    url.searchParams.delete('open');
    history.replaceState(null, '', url.pathname + (url.search?url.search:'') + '#/');
    routeToTag(open.toUpperCase());
  }
}

/* ============================================================
   BOOT
   ============================================================ */
document.addEventListener('DOMContentLoaded', ()=>{
  handleInitialDeepLink();
  render();
  boot();
});
</script>
